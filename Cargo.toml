[package]
name = "smooth-resizing-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
windows-core = "0.62" # required for `sys::interface` to work, and for nothing else
windows-numerics = "0.3.1"

[dependencies.windows]
version = "0.62"
features = [
	"Win32_UI_WindowsAndMessaging",
	"Win32_Graphics_Gdi",
	"Win32_Graphics_DirectComposition",
	"Win32_Graphics_Dxgi",
	"Win32_Graphics_Direct3D11",
	"Win32_Graphics_Direct3D",
	"Win32_Graphics_Direct2D",
	"Win32_Graphics_Direct2D_Common",
	"Win32_Graphics_Dxgi_Common",
	"Win32_Graphics_Dwm",
	"Win32_System_LibraryLoader",
	"Win32_System_WinRT",
	"Win32_System_WinRT_Composition",
	"Win32_System_Com",
	"UI_Core",
	"UI_Composition",
	"UI_Composition_Desktop",
	"Graphics_DirectX",
	"System",
]

[build-dependencies]
embed-resource = "2.5"
