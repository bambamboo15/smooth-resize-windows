[package]
name = "smooth-resizing-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
windows-core = "0.61" # required for `sys::interface` to work, and for nothing else

[dependencies.windows]
version = "0.61"
features = [
	"Win32_UI_WindowsAndMessaging",
	"Win32_Graphics_Gdi",
	"Win32_System_LibraryLoader",
	"Win32_Graphics_DirectComposition",
	"Win32_Graphics_Dxgi",
	"Win32_Graphics_Direct3D11",
	"Win32_Graphics_Direct3D",
	"Win32_Graphics_Dxgi_Common",
	"Win32_Graphics_Direct3D_Fxc",
	"Win32_System_WinRT",
	"Win32_System_Com",
	"UI_Core",
]

[build-dependencies]
embed-resource = "2.5"
